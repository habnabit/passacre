name: build wheels

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
            musl: yes
          - runner: ubuntu-latest
            target: x86
            musl: yes
          - runner: ubuntu-latest
            target: aarch64
            musl: yes
          - runner: ubuntu-latest
            target: armv7
            musl: yes
          - runner: ubuntu-latest
            target: s390x
            musl: no
          - runner: ubuntu-latest
            target: ppc64le
            musl: no
        compiler:
          - cc: 'clang'
            ldshared: 'clang -shared'
    steps:
      - uses: actions/checkout@v4
      - name: 'install compiler'
        run: |
          sudo apt-get install -y ${{ matrix.compiler.cc }}
          echo >> "$GITHUB_ENV" 'CC=${{ matrix.compiler.cc }}'
          echo >> "$GITHUB_ENV" 'LDSHARED=${{ matrix.compiler.ldshared }}'
      - uses: actions/setup-python@v5
        with:
          python-version: |
            pypy3.9
            pypy3.10
            3.7
            3.8
            3.9
            3.10
            3.11
            3.12
      - name: Build manylinux-auto wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
          manylinux: auto
      - name: Build musl wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: |
            pypy3.9
            pypy3.10
            3.7
            3.8
            3.9
            3.10
            3.11
            3.12
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-12
            target: x86_64
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: |
            pypy3.9
            pypy3.10
            3.8
            3.9
            3.10
            3.11
            3.12
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist
